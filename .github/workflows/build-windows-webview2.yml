name: Build MediaFlow Windows WebView2 Desktop
on:
  workflow_dispatch:
  push:
    branches: [website-parity-shell]
    paths:
      - 'desktop/windows-site/**'
      - '.github/workflows/build-windows-webview2.yml'
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore desktop/windows-site/MediaFlow.Desktop.csproj
      - name: Compile self-contained Windows desktop application
        run: dotnet publish desktop/windows-site/MediaFlow.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o desktop/windows-site/dist
      - name: Set user-facing executable name
        shell: pwsh
        run: |
          Rename-Item 'desktop/windows-site/dist/MediaFlow.exe' 'MediaFlow by Alex Godly.exe'
          Copy-Item 'desktop/windows-site/README.txt' 'desktop/windows-site/dist/README.txt'
      - name: Verify application binary
        shell: pwsh
        run: |
          if (-not (Test-Path 'desktop/windows-site/dist/MediaFlow by Alex Godly.exe')) { throw 'Missing desktop executable' }
          Get-ChildItem -Recurse desktop/windows-site/dist | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: MediaFlow-Windows-Desktop-WebView2
          path: desktop/windows-site/dist/**
          if-no-files-found: error
