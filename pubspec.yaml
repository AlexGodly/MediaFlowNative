name: mediaflow_native
description: MediaFlow by Alex Godly - exact website shell for Android and Windows
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  path_provider: ^2.1.5
  intl: ^0.20.2
  flutter_inappwebview: ^6.1.5
  file_saver: ^0.5.0
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
  assets:
    - assets/mediaflow.png
    - assets/category-icons/
